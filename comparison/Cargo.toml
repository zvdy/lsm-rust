[package]
name = "lsm-comparison"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cross-engine benchmark and correctness harness for lsm-rust"

# Detached from the parent on purpose. lsm-rust ships with two dependencies and
# a cargo-deny policy; the engines compared here drag in far more, and none of
# it belongs in the published crate's dependency graph or audit surface.
[workspace]

[dependencies]
anyhow = "1"
lsm-rust = { path = ".." }
redb = "4.3"
sled = "0.34"
fjall = "3.1"
# RocksDB builds a bundled C++ library and takes roughly ten minutes from cold.
# Opt in with `--features rocksdb`.
rocksdb = { version = "0.25", optional = true }

[features]
rocksdb = ["dep:rocksdb"]

[profile.release]
debug = true
