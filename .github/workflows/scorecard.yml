name: OpenSSF Scorecard

# Supply-chain health checks from the OpenSSF Scorecard project. Results are
# uploaded to the repository's code-scanning dashboard and drive the badge in
# the README.
on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # weekly, Monday
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result
      id-token: write          # publish results for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to an exact commit: this action publishes no moving major tag
      # (`v2` does not exist as a ref, which is why every run of this workflow
      # since it was added failed to resolve it), and a digest is what the
      # Pinned-Dependencies check this workflow reports on wants to see.
      # Dependabot updates the digest and the comment together.
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
