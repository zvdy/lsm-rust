name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: make fmt-check

      - name: Clippy
        run: make lint

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `stable` gates merges; `beta` is an early-warning signal for
        # upcoming compiler changes and is allowed to fail.
        toolchain: [ stable, beta ]
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: make test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: make doc

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: make release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-tarpaulin

      - name: Run tests with coverage
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: make audit

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['rust-version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Keeps the declared MSRV honest: if a newer API sneaks in, this fails.
      - name: Check against the MSRV
        run: cargo check --all-targets --all-features

  deny:
    name: Licenses & Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.9
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, sources and bans
        run: make deny

  # Single required status check for branch protection: it succeeds only when
  # every gating job above has succeeded (and fails fast if any did not).
  ci:
    name: CI
    if: always()
    needs: [ lint, test, docs, build, coverage, audit, msrv, deny ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gating jobs succeeded
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "build=${{ needs.build.result }}"
          echo "coverage=${{ needs.coverage.result }}"
          echo "audit=${{ needs.audit.result }}"
          echo "msrv=${{ needs.msrv.result }}"
          echo "deny=${{ needs.deny.result }}"
          test "${{ needs.lint.result }}" = "success" \
            && test "${{ needs.test.result }}" = "success" \
            && test "${{ needs.docs.result }}" = "success" \
            && test "${{ needs.build.result }}" = "success" \
            && test "${{ needs.coverage.result }}" = "success" \
            && test "${{ needs.audit.result }}" = "success" \
            && test "${{ needs.msrv.result }}" = "success" \
            && test "${{ needs.deny.result }}" = "success"
