name: Release

# Cutting a release: push a `vX.Y.Z` tag matching the version in Cargo.toml.
# The workflow verifies the two agree, runs the full gate, builds binaries,
# publishes a GitHub Release, and — when a CARGO_REGISTRY_TOKEN secret is
# configured — publishes the crate to crates.io.
#
# Rehearsal: run the workflow manually with `dry_run` enabled. It performs every
# check and build (gate, binaries, image build) but publishes nothing: no GitHub
# Release, no crates.io upload, no registry push, no signing.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build and verify everything but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve version and check it matches Cargo.toml
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run the full gate
        run: make check

      - name: Verify the package builds for publishing
        run: cargo package --allow-dirty

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          name="lsm-rust-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lsm-rust" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lsm-rust-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [ verify, build ]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: dist/*.tar.gz

  publish-crate:
    name: Publish to crates.io
    needs: [ verify, release ]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publishing is opt-in: without the token the release still succeeds and
      # this step reports that it was skipped.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured — skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked

  image:
    name: Publish container image
    needs: [ verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing and AWS OIDC
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
        if: ${{ !inputs.dry_run }}

      - name: Sign the image by digest
        if: ${{ !inputs.dry_run }}
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Optional: mirror into ECR when a push role is configured
      # (see the lsm-infra repository). Skipped silently otherwise.
      - name: Configure AWS credentials
        if: ${{ !inputs.dry_run && vars.AWS_ECR_PUSH_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Mirror to ECR
        if: ${{ !inputs.dry_run && vars.AWS_ECR_PUSH_ROLE_ARN != '' }}
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker buildx imagetools create \
            -t "$registry/${{ vars.AWS_ECR_REPOSITORY || 'lsm-rust' }}:${{ needs.verify.outputs.version }}" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
