name: Bug Report
description: Report a bug in lsm-rust
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code to reproduce the behavior.
      placeholder: |
        1. Create a Storage at ...
        2. Put/delete keys ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Linux x86_64, rustc 1.94.1
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output with the -v flag enabled, backtraces, etc.
      render: shell
