# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Enforced in CI by the `deny` job. Run locally with `make deny`.

[advisories]
# Fail on any crate with a known security advisory or that is unmaintained.
yanked = "deny"
ignore = []

[licenses]
# Only permissive licenses compatible with this project's MIT license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate bloat builds; warn so they stay visible.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
