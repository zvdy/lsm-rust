apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lsm-rust.fullname" . }}
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
spec:
  # Single writer: the engine owns its data directory exclusively.
  replicas: 1
  serviceName: {{ include "lsm-rust.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy }}
    whenScaled: {{ .Values.persistence.retentionPolicy }}
  selector:
    matchLabels: {{- include "lsm-rust.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lsm-rust.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lsm-rust.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lsm-rust
          image: {{ include "lsm-rust.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: LSM_ADDR
              value: "0.0.0.0:6379"
            - name: LSM_DATA_DIR
              value: /data
            - name: LSM_METRICS_ADDR
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            - name: LSM_MAX_CONNECTIONS
              value: {{ .Values.server.maxConnections | quote }}
            - name: LSM_IDLE_TIMEOUT_SECS
              value: {{ .Values.server.idleTimeoutSeconds | quote }}
            {{- if .Values.auth.enabled }}
            - name: LSM_REQUIREPASS_FILE
              value: /var/run/secrets/lsm-rust/password
            {{- end }}
          ports:
            - { name: resp, containerPort: 6379, protocol: TCP }
            - { name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.auth.enabled }}
            - { name: auth, mountPath: /var/run/secrets/lsm-rust, readOnly: true }
            {{- end }}
      {{- if .Values.auth.enabled }}
      volumes:
        - name: auth
          secret:
            secretName: {{ include "lsm-rust.secretName" . }}
            defaultMode: 0440
            items:
              - { key: password, path: password }
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "lsm-rust.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
