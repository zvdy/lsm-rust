{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "lsm-rust.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
  annotations:
    # Keep the generated password stable across upgrades and uninstalls.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
