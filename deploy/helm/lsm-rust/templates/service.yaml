apiVersion: v1
kind: Service
metadata:
  name: {{ include "lsm-rust.fullname" . }}
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "lsm-rust.selectorLabels" . | nindent 4 }}
  ports:
    - name: resp
      port: {{ .Values.service.port }}
      targetPort: resp
---
# Headless service gives the StatefulSet pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lsm-rust.fullname" . }}-headless
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "lsm-rust.selectorLabels" . | nindent 4 }}
  ports:
    - name: resp
      port: {{ .Values.service.port }}
      targetPort: resp
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
