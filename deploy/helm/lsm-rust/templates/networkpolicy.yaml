{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lsm-rust.fullname" . }}
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lsm-rust.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 6379, protocol: TCP }
      from:
        - podSelector:
            {{- with .Values.networkPolicy.allowedClientLabels }}
            matchLabels: {{- toYaml . | nindent 14 }}
            {{- else }}
            {}
            {{- end }}
    {{- if .Values.metrics.serviceMonitor.enabled }}
    - ports:
        - { port: {{ .Values.metrics.port }}, protocol: TCP }
      from:
        {{- range .Values.networkPolicy.metricsNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
