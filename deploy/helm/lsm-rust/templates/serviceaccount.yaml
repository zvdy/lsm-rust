{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lsm-rust.fullname" . }}
  labels: {{- include "lsm-rust.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The process never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
